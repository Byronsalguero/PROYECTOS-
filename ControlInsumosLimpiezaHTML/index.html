<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Control de Insumos de Limpieza</title>
<style>
body{font-family:Arial;margin:0;background:#f3f6f9;color:#222}header{background:#1769aa;color:white;text-align:center;padding:20px}.wrap{max-width:1200px;margin:20px auto;padding:0 15px}.card{background:white;padding:20px;margin-bottom:20px;border-radius:10px;box-shadow:0 2px 8px #0002}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.field{display:flex;flex-direction:column;gap:5px}.field input,.field select{padding:10px;border:1px solid #ccc;border-radius:5px}button{border:0;border-radius:5px;padding:9px 12px;margin:3px;cursor:pointer;font-weight:bold}.add{background:#198754;color:#fff}.edit{background:#ffc107}.del{background:#dc3545;color:#fff}table{width:100%;border-collapse:collapse}th{background:#1769aa;color:#fff}th,td{padding:9px;border-bottom:1px solid #ddd;text-align:center}.low{color:#dc3545;font-weight:bold}.ok{color:#198754;font-weight:bold}.stats{display:flex;gap:15px}.stat{flex:1;background:#eef5fb;padding:15px;text-align:center;border-radius:8px}.stat b{font-size:25px;display:block}@media(max-width:700px){.grid{grid-template-columns:1fr}.stats{flex-direction:column}}
</style></head>
<body>
<header><h1>Control de Insumos de Limpieza</h1><p>Municipalidad - Inventario y Entregas</p></header>
<div class="wrap">
<div class="stats"><div class="stat">Productos<b id="nprod">0</b></div><div class="stat">Existencias<b id="nexist">0</b></div><div class="stat">Entregas<b id="nent">0</b></div></div>
<div class="card"><h2>📦 Inventario</h2><div class="grid"><div class="field"><label>Producto</label><input id="producto"></div><div class="field"><label>Descripción</label><input id="descripcion"></div><div class="field"><label>Cantidad</label><input id="cantidad" type="number" min="0"></div></div><button class="add" onclick="agregarProducto()">➕ Agregar / sumar existencia</button></div>
<div class="card"><h2>📋 Existencias actuales</h2><div style="overflow:auto"><table><thead><tr><th>Producto</th><th>Descripción</th><th>Existencias</th><th>Acciones</th></tr></thead><tbody id="inv"></tbody></table></div></div>
<div class="card"><h2>🚚 Registrar entrega</h2><div class="grid"><div class="field"><label>Fecha</label><input id="fecha" type="date"></div><div class="field"><label>Persona que recibe</label><input id="persona"></div><div class="field"><label>Área</label><select id="area"><option value="">Seleccione</option><option>PMT</option><option>ATATUPA</option><option>Curso de Inglés</option><option>Casa de la Cultura</option><option>Baños Municipales</option><option>Baños Buses</option><option>Limpieza Edificio Municipal</option><option>Computación</option><option>Universidad</option><option>Polideportivo</option><option>Estadio</option><option>Salón Municipal</option><option>Limpieza Parque</option><option>Camiones Municipales</option><option>Anexo</option><option>Comedor</option></select></div><div class="field"><label>Producto</label><select id="prodEntrega"></select></div><div class="field"><label>Cantidad entregada</label><input id="cantEntrega" type="number" min="1"></div></div><button class="add" onclick="entregar()">🚚 Registrar entrega</button></div>
<div class="card"><h2>📑 Historial de entregas</h2><div style="overflow:auto"><table><thead><tr><th>Fecha</th><th>Persona</th><th>Área</th><th>Producto</th><th>Cantidad</th><th>Acciones</th></tr></thead><tbody id="hist"></tbody></table></div></div>
</div>
<script>
let inv=JSON.parse(localStorage.getItem('limp_inv')||'[]'),ent=JSON.parse(localStorage.getItem('limp_ent')||'[]');fecha.value=new Date().toISOString().slice(0,10);
function save(){localStorage.setItem('limp_inv',JSON.stringify(inv));localStorage.setItem('limp_ent',JSON.stringify(ent))}
function agregarProducto(){let n=producto.value.trim(),d=descripcion.value.trim(),c=Number(cantidad.value);if(!n||!Number.isInteger(c)||c<0)return alert('Ingrese producto y cantidad válida.');let p=inv.find(x=>x.nombre.toLowerCase()===n.toLowerCase());if(p){p.descripcion=d;p.existencia+=c}else inv.push({id:Date.now(),nombre:n,descripcion:d,existencia:c});save();render();producto.value='';descripcion.value='';cantidad.value=''}
function editarExistencias(id){let p=inv.find(x=>x.id===id);let v=prompt('Nueva existencia para '+p.nombre+' (actual: '+p.existencia+')');if(v===null)return;v=Number(v);if(!Number.isInteger(v)||v<0)return alert('Cantidad inválida.');p.existencia=v;save();render()}
function editarProducto(id){let p=inv.find(x=>x.id===id),n=prompt('Nombre:',p.nombre),d=prompt('Descripción:',p.descripcion);if(n===null||d===null)return;p.nombre=n.trim();p.descripcion=d.trim();save();render()}
function borrarProducto(id){if(ent.some(x=>x.productoId===id))return alert('No puede borrar un producto con historial de entregas.');if(confirm('¿Eliminar producto?')){inv=inv.filter(x=>x.id!==id);save();render()}}
function entregar(){let p=inv.find(x=>x.id===Number(prodEntrega.value)),c=Number(cantEntrega.value);if(!fecha.value||!persona.value.trim()||!area.value||!p||!Number.isInteger(c)||c<=0)return alert('Complete todos los campos.');if(c>p.existencia)return alert('Existencias insuficientes. Disponibles: '+p.existencia);p.existencia-=c;ent.push({id:Date.now(),fecha:fecha.value,persona:persona.value.trim(),area:area.value,productoId:p.id,producto:p.nombre,cantidad:c});save();render();persona.value='';area.value='';cantEntrega.value=''}
function editarEntrega(id){let e=ent.find(x=>x.id===id),p=inv.find(x=>x.id===e.productoId);let c=Number(prompt('Nueva cantidad:',e.cantidad));if(!Number.isInteger(c)||c<=0)return alert('Cantidad inválida.');let dif=c-e.cantidad;if(dif>p.existencia)return alert('No hay existencias suficientes.');p.existencia-=dif;let per=prompt('Persona:',e.persona),ar=prompt('Área:',e.area),f=prompt('Fecha:',e.fecha);if(per===null||ar===null||f===null){p.existencia+=dif;return}e.cantidad=c;e.persona=per;e.area=ar;e.fecha=f;save();render()}
function borrarEntrega(id){let e=ent.find(x=>x.id===id);if(!confirm('¿Eliminar entrega y devolver cantidad al inventario?'))return;let p=inv.find(x=>x.id===e.productoId);if(p)p.existencia+=e.cantidad;ent=ent.filter(x=>x.id!==id);save();render()}
function render(){inv.innerHTML='';let total=0;window.inv.forEach(p=>{total+=p.existencia;inv.insertAdjacentHTML('beforeend',`<tr><td>${p.nombre}</td><td>${p.descripcion}</td><td class="${p.existencia<=5?'low':'ok'}">${p.existencia}</td><td><button class="edit" onclick="editarExistencias(${p.id})">✏️ Editar Existencias</button><button class="edit" onclick="editarProducto(${p.id})">✏️ Editar</button><button class="del" onclick="borrarProducto(${p.id})">🗑️</button></td></tr>`)});nprod.textContent=inv.length;nexist.textContent=total;nent.textContent=ent.length;prodEntrega.innerHTML='<option value="">Seleccione producto</option>';inv.forEach(p=>prodEntrega.insertAdjacentHTML('beforeend',`<option value="${p.id}">${p.nombre} (Disponible: ${p.existencia})</option>`));hist.innerHTML='';ent.forEach(e=>hist.insertAdjacentHTML('beforeend',`<tr><td>${e.fecha}</td><td>${e.persona}</td><td>${e.area}</td><td>${e.producto}</td><td>${e.cantidad}</td><td><button class="edit" onclick="editarEntrega(${e.id})">✏️ Editar</button><button class="del" onclick="borrarEntrega(${e.id})">🗑️</button></td></tr>`))}
render();
</script></body></html>
