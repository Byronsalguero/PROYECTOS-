<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Inventario Municipal</title><style>body{font-family:Arial;margin:30px;background:#f4f6f8;color:#222}h1{color:#17365d}.card{background:white;padding:20px;margin:15px 0;border-radius:10px;box-shadow:0 2px 8px #ccc}input,select,button{padding:10px;margin:5px;border:1px solid #bbb;border-radius:6px}button{background:#17365d;color:white;cursor:pointer}table{width:100%;border-collapse:collapse;background:white}th,td{padding:9px;border-bottom:1px solid #ddd;text-align:left}.totales{font-weight:bold}</style></head><body><h1>Inventario Municipal</h1><div class="card"><h2>Registrar encargado</h2><input id="nombre" placeholder="Nombre"><input id="puesto" placeholder="Puesto"><input id="dependencia" placeholder="Dependencia"><button onclick="guardarEncargado()">Guardar</button></div><div class="card"><h2>Registrar bien</h2><input id="codigo" placeholder="Código"><input id="descripcion" placeholder="Descripción"><input id="categoria" placeholder="Categoría"><input id="cantidad" type="number" placeholder="Cantidad"><input id="valor" type="number" step="0.01" placeholder="Valor unitario"><button onclick="guardarBien()">Guardar bien</button></div><div class="card"><h2>Inventario</h2><button onclick="cargar()">Actualizar</button><table><thead><tr><th>Código</th><th>Descripción</th><th>Cantidad</th><th>Valor unitario</th><th>Estado</th></tr></thead><tbody id="tabla"></tbody></table></div><script>const api='/api';async function guardarEncargado(){await fetch(api+'/encargados',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({nombre:nombre.value,puesto:puesto.value,dependencia:dependencia.value})});alert('Encargado guardado')}async function guardarBien(){await fetch(api+'/bienes',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({codigo:codigo.value,descripcion:descripcion.value,categoria:categoria.value,cantidad:+cantidad.value,valorUnitario:+valor.value})});alert('Bien guardado');cargar()}async function cargar(){const r=await fetch(api+'/bienes');const d=await r.json();tabla.innerHTML=d.map(x=>`<tr><td>${x.codigo}</td><td>${x.descripcion}</td><td>${x.cantidad}</td><td>Q ${x.valorUnitario}</td><td>${x.estado}</td></tr>`).join('')}cargar();</script></body></html>
